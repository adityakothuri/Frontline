name: CI

# Verification for every PR and push to main/dev: typecheck, lint, and unit
# tests. No production/EAS builds, and no secrets required.

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify (typecheck + lint)
        run: npm run verify

      - name: Test
        run: npm test
