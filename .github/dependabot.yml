version: 2
updates:
  # Keep GitHub Actions versions current (low volume, weekly).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(actions)"
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]

  # npm ecosystem. Harmlessly inactive until package.json exists, then weekly,
  # with minor/patch grouped into one PR to avoid spam.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
