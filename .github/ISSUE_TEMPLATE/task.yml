name: "🧩 Task"
description: A scoped, single implementation task (one task per branch).
title: "task: "
labels: ["type: chore"]
body:
  - type: markdown
    attributes:
      value: |
        One task per branch. Write a short plan before coding, and run
        `npm run verify` before opening the PR.
  - type: textarea
    id: summary
    attributes:
      label: Task summary
      description: One clear task — not a bundle of work.
    validations:
      required: true
  - type: input
    id: phase
    attributes:
      label: Phase / roadmap link
      description: Which part of the roadmap this belongs to.
    validations:
      required: true
  - type: textarea
    id: dod
    attributes:
      label: Definition of done
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Files likely affected
  - type: dropdown
    id: newfiles
    attributes:
      label: New files needed?
      options: [No, "Yes — listed below (needs approval)"]
    validations:
      required: true
  - type: dropdown
    id: approval
    attributes:
      label: Approval needed?
      description: New app files/dependencies/features require approval first.
      options: [No, Yes]
    validations:
      required: true
  - type: checkboxes
    id: quality
    attributes:
      label: Quality checks planned
      options:
        - label: typecheck
        - label: lint
        - label: test (if meaningful)
        - label: manual run of the flow
